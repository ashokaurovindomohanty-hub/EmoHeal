<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EmoHeal - AI Emotion Wellness</title>
<meta name="description" content="EmoHeal - Detect emotions, journal, and get AI coaching for wellness">
<link rel="stylesheet" href="/static/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
<h1>EmoHeal</h1>
<textarea id="text" placeholder="How are you feeling today?"></textarea>
<button onclick="detect()">Detect Emotion</button>
<p id="result"></p>
<div id="dayResult" style="font-weight:bold;margin:10px 0;"></div>
<canvas id="emoChart" height="120"></canvas>
<textarea id="journalText" placeholder="How was your day?"></textarea>
<button onclick="saveJournal()">Save Entry</button>
<button onclick="showHistory()">History</button>
<div id="historyBox" style="margin-top:12px;"></div>
<div id="coaching" style="margin-top:15px;padding:10px;border:1px solid #ddd;border-radius:8px;"></div>
<div id="streak" style="margin-top:10px;font-weight:bold;"></div>
<button onclick="shareBadge()" style="margin-top:8px;background:#00c853;">Share 🔥</button>
<canvas id="happyChart" style="max-height:250px;margin-top:15px;"></canvas>
<footer style="margin-top:20px;text-align:center;font-size:12px;opacity:0.6;">© 2026 EmoHeal • Built with AWS Lambda + Comprehend</footer>
</div>
<script src="/static/js/script.js"></script>
</body>
</html>
