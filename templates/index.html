<!DOCTYPE html>
<html>
<head>
  <title>EmoHeal</title>
  <link rel="stylesheet" href="/static/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <h1>EmoHeal</h1>
    <textarea id="text" placeholder="How are you feeling today?"></textarea>
    <button onclick="detect()">Detect Emotion</button>
    <p id="result"></p>
  <div id="history" style="margin-top:20px;color:white;"></div>
<canvas id="emoChart" height="120"></canvas>
<textarea id="journalText" placeholder="How was your day?"></textarea>
<button onclick="saveJournal()">Save Entry</button>
<div id="journalHistory"></div>
</div>
  <script src="/static/js/script.js"></script>
</body>
</html>
